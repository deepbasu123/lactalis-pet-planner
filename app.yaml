command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: PET_CATALOG
    value: "main"
  - name: PET_SILVER_SCHEMA
    value: "lactalis_pet_silver"
  - name: PET_GOLD_SCHEMA
    value: "lactalis_pet_gold"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "<warehouse_id>"
  - name: PET_WAREHOUSE_ID
    value: "<warehouse_id>"
  - name: PET_PIPELINE_ID
    value: "<pipeline_id>"
  - name: PET_VOLUME
    value: "main.lactalis_pet_bronze.landing"
  - name: PET_GENIE_SPACE_ID
    value: "<genie_space_id>"
