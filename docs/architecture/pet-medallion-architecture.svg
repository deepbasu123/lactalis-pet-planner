<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><rect width="1600" height="1000" fill="#FFFFFF"/><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B2239" flood-opacity="0.12"/></filter><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#004B85"/></marker><marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><style>text{font-family:Helvetica,Arial,sans-serif}.ct{font-weight:700}.cd{font-size:12.5px}.lbl{font-size:12px}</style><text x="60" y="58" font-size="31" font-weight="700" fill="#0B2239" font-family="Helvetica,Arial,sans-serif">Lactalis NOVA PET Line Planner</text><text x="61" y="90" font-size="16" fill="#004B85" font-family="Helvetica,Arial,sans-serif">Databricks medallion architecture — rules and table processing run in the backend; the app only serves.</text><line x1="60" y1="108" x2="1540" y2="108" stroke="#D9E1EA" stroke-width="1.5"/><rect x="60" y="200" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="60" y="200" width="6" height="150" rx="3" fill="#5BC5F2"/><text x="82" y="230" class="ct" fill="#0B2239" font-size="15">1 · Data in</text><text x="82" y="254" class="cd" fill="#3E5060">Planner uploads the PET</text><text x="82" y="274" class="cd" fill="#3E5060">“Traffic Lights” workbook (.xlsx)</text><text x="82" y="294" class="cd" fill="#3E5060"></text><text x="82" y="314" class="cd" fill="#3E5060">Synthetic seed — same path</text><path d="M312,275 L343,275" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><rect x="345" y="215" width="215" height="120" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="345" y="215" width="6" height="120" rx="3" fill="#004B85"/><text x="367" y="245" class="ct" fill="#0B2239" font-size="15">UC Volume</text><text x="367" y="269" class="cd" fill="#3E5060">main.lactalis_pet_bronze</text><text x="367" y="289" class="cd" fill="#3E5060">.landing / uploads/</text><path d="M562,275 L598,275" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><rect x="600" y="150" width="440" height="430" rx="16" fill="#F7FAFC" stroke="#D9E1EA"/><text x="622" y="182" class="ct" font-size="16" fill="#0B2239">2 · Lakeflow Declarative Pipeline</text><text x="622" y="204" class="cd" fill="#3E5060">serverless · Bronze → Silver → Gold</text><rect x="622" y="220" width="396" height="92" rx="12" fill="#FBF3EA" stroke="#D9E1EA" filter="url(#sh)"/><rect x="622" y="220" width="6" height="92" rx="3" fill="#B87333"/><text x="644" y="250" class="ct" fill="#0B2239" font-size="15">BRONZE</text><text x="644" y="274" class="cd" fill="#3E5060">Raw workbook rows (openpyxl)</text><text x="644" y="294" class="cd" fill="#3E5060">+ ingest metadata</text><path d="M820,312 L820,330" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><rect x="622" y="330" width="396" height="108" rx="12" fill="#F1F4F7" stroke="#D9E1EA" filter="url(#sh)"/><rect x="622" y="330" width="6" height="108" rx="3" fill="#7C8798"/><text x="644" y="360" class="ct" fill="#0B2239" font-size="15">SILVER</text><text x="644" y="384" class="cd" fill="#3E5060">sku · week · demand · plan_line</text><text x="644" y="404" class="cd" fill="#3E5060">opening_stock · parameter  +  DQ expectations</text><path d="M820,438 L820,456" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><rect x="622" y="456" width="396" height="104" rx="12" fill="#FBF6DF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="622" y="456" width="6" height="104" rx="3" fill="#C9A227"/><text x="644" y="486" class="ct" fill="#0B2239" font-size="15">GOLD  ·  the rule engine (SQL)</text><text x="644" y="510" class="cd" fill="#3E5060">projection · week_capacity</text><text x="644" y="530" class="cd" fill="#3E5060">summary · projection_snapshot</text><path d="M1020,505 L1080,300" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><text x="1050.0" y="394.5" class="lbl" fill="#004B85" text-anchor="middle">reads Gold</text><rect x="1082" y="225" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="1082" y="225" width="6" height="150" rx="3" fill="#004B85"/><text x="1104" y="255" class="ct" fill="#0B2239" font-size="15">3 · Databricks App</text><text x="1104" y="279" class="cd" fill="#3E5060">React + FastAPI</text><text x="1104" y="299" class="cd" fill="#3E5060">Thin serving layer —</text><text x="1104" y="319" class="cd" fill="#3E5060">zero business logic</text><text x="1104" y="339" class="cd" fill="#3E5060">reads Gold · writes edits · uploads</text><path d="M1334,250 L1372,220" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><path d="M1334,320 L1372,332" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><rect x="1372" y="175" width="180" height="95" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="1372" y="175" width="6" height="95" rx="3" fill="#5BC5F2"/><text x="1394" y="205" class="ct" fill="#0B2239" font-size="15">Genie (embedded)</text><text x="1394" y="229" class="cd" fill="#3E5060">“which products</text><text x="1394" y="249" class="cd" fill="#3E5060">are red?”</text><rect x="1372" y="300" width="180" height="95" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="1372" y="300" width="6" height="95" rx="3" fill="#5BC5F2"/><text x="1394" y="330" class="ct" fill="#0B2239" font-size="15">AI/BI dashboard</text><text x="1394" y="354" class="cd" fill="#3E5060">live traffic-light</text><text x="1394" y="374" class="cd" fill="#3E5060">summary</text><text x="1372" y="418" class="lbl" fill="#3E5060">Genie &amp; AI/BI query the Gold tables.</text><rect x="600" y="620" width="440" height="120" rx="12" fill="#FFFFFF" stroke="#D9E1EA" filter="url(#sh)"/><rect x="600" y="620" width="6" height="120" rx="3" fill="#C9A227"/><text x="622" y="650" class="ct" fill="#0B2239" font-size="15">Interactive recompute</text><text x="622" y="674" class="cd" fill="#3E5060">Serverless SQL warehouse runs the SAME Gold rule SQL</text><text x="622" y="694" class="cd" fill="#3E5060">silver.plan_overlay holds edits — recompute in seconds</text><path d="M1150,378 L1042,632" stroke="#004B85" stroke-width="2.2" marker-end="url(#arw)" fill="none"/><text x="1096.0" y="497.0" class="lbl" fill="#004B85" text-anchor="middle">edit</text><path d="M900,620 L900,565" stroke="#C9A227" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arw2)" fill="none"/><text x="912" y="600" class="lbl" fill="#3E5060">same rule SQL</text><text x="1075" y="662" class="lbl" fill="#3E5060">One rule definition, two engines:</text><text x="1075" y="682" class="lbl" fill="#3E5060">pipeline (batch) + warehouse (interactive),</text><text x="1075" y="702" class="lbl" fill="#3E5060">proven number-for-number.</text><rect x="60" y="800" width="1480" height="150" rx="16" fill="#EAF3FA" stroke="#5BC5F2"/><text x="88" y="838" class="ct" font-size="16" fill="#004B85">Unity Catalog governance</text><text x="88" y="866" class="cd" fill="#3E5060">Governs every catalog, schema, volume and table across the medallion. Grants are scoped to the app’s service principal:</text><text x="88" y="888" class="cd" fill="#3E5060">USE CATALOG/SCHEMA + SELECT on all three schemas, MODIFY on Silver, READ/WRITE on the Volume, CAN_USE warehouse, CAN_RUN pipeline + Genie.</text><text x="88" y="922" class="cd" fill="#3E5060">Catalog and warehouse are configurable per workspace (shown here as the generic “main” catalog).</text></svg>